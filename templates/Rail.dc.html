<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-ee90f652-4af0-41e4-9532-c962d0ef2cdc/styles.css">
<script src="_ds/modernist-ee90f652-4af0-41e4-9532-c962d0ef2cdc/_ds_bundle.js"></script>
<style>
.r2{width:260px;height:100%;box-sizing:border-box;background:#fff;border-right:1px solid #dfe4ea;display:flex;flex-direction:column;font-family:"Archivo","Noto Sans SC",system-ui,sans-serif;color:#10161d;overflow:hidden}
.r2-brand{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px}
.r2-a{display:flex;align-items:center;gap:11px;height:34px;padding:0 18px;font-size:14px;color:#3d4650;box-sizing:border-box}
.r2-a.on{background:#eef2f6;color:#10161d;font-weight:700}
.r2-g{font-size:11px;letter-spacing:.14em;color:#98a2ac;font-weight:700;padding:22px 18px 6px}
.r2-f{display:flex;align-items:center;gap:9px;padding:5px 18px;font-size:13px;color:#10161d;font-weight:600}
.r2-s{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 18px 5px 38px;font-size:13px;color:#5a6672;white-space:nowrap;overflow:hidden}
.r2-s.on{background:#eef2f6;color:#10161d;font-weight:700}
.r2-more{padding:4px 18px 4px 38px;font-size:13px;color:#98a2ac}
.r2i{width:16px;height:16px;flex:0 0 16px;background:currentColor;-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat}
.i-bot{-webkit-mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 8V4H8'/><rect width='16' height='12' x='4' y='8' rx='2'/><path d='M2 14h2'/><path d='M20 14h2'/><path d='M15 13v2'/><path d='M9 13v2'/></svg>");mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 8V4H8'/><rect width='16' height='12' x='4' y='8' rx='2'/><path d='M2 14h2'/><path d='M20 14h2'/><path d='M15 13v2'/><path d='M9 13v2'/></svg>")}

.i-lib{-webkit-mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='8' height='18' x='3' y='3' rx='1'/><path d='M7 3v18'/><path d='M20.4 18.9c.2.5-.1 1.1-.6 1.3l-1.9.7c-.5.2-1.1-.1-1.3-.6L11.1 5.1c-.2-.5.1-1.1.6-1.3l1.9-.7c.5-.2 1.1.1 1.3.6Z'/></svg>");mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='8' height='18' x='3' y='3' rx='1'/><path d='M7 3v18'/><path d='M20.4 18.9c.2.5-.1 1.1-.6 1.3l-1.9.7c-.5.2-1.1-.1-1.3-.6L11.1 5.1c-.2-.5.1-1.1.6-1.3l1.9-.7c.5-.2 1.1.1 1.3.6Z'/></svg>")}
.i-blocks{-webkit-mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='7' height='7' x='14' y='3' rx='1'/><path d='M10 21V8a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1H10'/></svg>");mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='7' height='7' x='14' y='3' rx='1'/><path d='M10 21V8a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1H10'/></svg>")}
.i-chart{-webkit-mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 3v18h18'/><path d='M18 17V9'/><path d='M13 17V5'/><path d='M8 17v-3'/></svg>");mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 3v18h18'/><path d='M18 17V9'/><path d='M13 17V5'/><path d='M8 17v-3'/></svg>")}
.i-folder{-webkit-mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z'/></svg>");mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z'/></svg>")}
.i-search{-webkit-mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='8'/><path d='m21 21-4.3-4.3'/></svg>");mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='8'/><path d='m21 21-4.3-4.3'/></svg>")}
.i-plus{-webkit-mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 5v14'/><path d='M5 12h14'/></svg>");mask-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 5v14'/><path d='M5 12h14'/></svg>")}

</helmet>

<div class="r2">
  <div class="r2-brand">
    <img src="assets/logo.png" alt="伯乐 Bole" style="height:26px;width:auto;display:block">
    <div style="display:flex;gap:12px;color:#98a2ac">
      <span class="r2i i-search"></span>
    </div>
  </div>

  <sc-if value="{{ isSession }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;min-height:0;flex:1">
      <div class="r2-g" style="color:#1d4b79">本场进度</div>
      <div style="padding:0 18px 10px;font-size:13px;color:#5a6672">后端工程师 · 初试</div>
      <div style="padding:2px 18px 16px;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;gap:10px;align-items:center;font-size:13px;color:#5a6672"><span style="width:18px;height:18px;background:#3781cf;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 18px">1</span>自我介绍</div>
        <div style="display:flex;gap:10px;align-items:center;font-size:13px;color:#5a6672"><span style="width:18px;height:18px;background:#3781cf;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 18px">2</span>MySQL 索引</div>
        <div style="display:flex;gap:10px;align-items:center;font-size:13px;color:#5a6672"><span style="width:18px;height:18px;background:#3781cf;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 18px">3</span>Redis 缓存穿透</div>
        <div style="display:flex;gap:10px;align-items:center;font-size:13px;color:#5a6672"><span style="width:18px;height:18px;background:#3781cf;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 18px">4</span>JVM 垃圾回收</div>
        <div style="display:flex;gap:10px;align-items:center;font-size:13px;color:#10161d;font-weight:700"><span style="width:18px;height:18px;border:2px solid #3781cf;color:#1d4b79;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;box-sizing:border-box;flex:0 0 18px">5</span>分布式事务</div>
        <div style="display:flex;gap:10px;align-items:center;font-size:13px;color:#98a2ac"><span style="width:18px;height:18px;border:1px solid #dfe4ea;font-size:10px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;flex:0 0 18px">6</span>待提问</div>
        <div style="display:flex;gap:10px;align-items:center;font-size:13px;color:#98a2ac"><span style="width:18px;height:18px;border:1px solid #dfe4ea;font-size:10px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;flex:0 0 18px">7</span>待提问</div>
        <div style="display:flex;gap:10px;align-items:center;font-size:13px;color:#98a2ac"><span style="width:18px;height:18px;border:1px solid #dfe4ea;font-size:10px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;flex:0 0 18px">8</span>编程题</div>
      </div>
      <div style="flex:1"></div>
      <div style="border-top:1px solid #dfe4ea;padding:14px 18px;display:flex;flex-direction:column;gap:10px">
        <div style="font-size:13px;color:#5a6672">用时 22:14</div>
        <div style="border:2px solid #10161d;height:34px;display:flex;align-items:center;padding:0 14px;font-size:13px;font-weight:600">结束并生成报告</div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isNav }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-direction:column;min-height:0;flex:1">
      <div class="{{ cls.new }}"><span class="r2i i-plus"></span><span>开始面试</span></div>
      <div class="{{ cls.records }}"><span class="r2i i-hist"></span><span>面试记录</span></div>
      <div class="{{ cls.resume }}"><span class="r2i i-file"></span><span>我的简历</span></div>
      <div class="{{ cls.learn }}"><span class="r2i i-book"></span><span>知识学习</span></div>
      <div class="{{ cls.practice }}"><span class="r2i i-code"></span><span>代码练习</span></div>

      <div class="r2-g">面试记录</div>
      <div style="flex:1;min-height:0;overflow:hidden">
        <div class="r2-f"><span class="r2i i-folder" style="color:#98a2ac"></span><span>后端工程师</span></div>
        <div class="{{ cls.t1 }}"><span>初试 · Seata 与索引</span><span style="font-size:11px;color:#98a2ac">61</span></div>
        <div class="r2-s"><span>初试 · 缓存与并发</span><span style="font-size:11px;color:#98a2ac">68</span></div>
        <div class="r2-s"><span>初试 · 未完成</span><span style="width:6px;height:6px;background:#3781cf;flex:0 0 6px"></span></div>
        <div class="r2-s"><span>复试 · 系统设计</span><span style="font-size:11px;color:#98a2ac">82</span></div>
        <div class="r2-more">展开显示</div>
        <div class="r2-f" style="margin-top:8px"><span class="r2i i-folder" style="color:#98a2ac"></span><span>前端工程师</span></div>
        <div class="r2-s"><span>HR · 团队协作</span><span style="font-size:11px;color:#98a2ac">74</span></div>
        <div class="r2-s"><span>初试 · React 基础</span><span style="font-size:11px;color:#98a2ac">57</span></div>
        <div class="r2-more">展开显示</div>
      </div>

      <div class="r2-g">运营</div>
      <div class="{{ cls.database }}"><span class="r2i i-lib"></span><span>知识库</span></div>
      <div class="{{ cls.problemsets }}"><span class="r2i i-blocks"></span><span>题库管理</span></div>
      <div class="{{ cls.dashboard }}"><span class="r2i i-chart"></span><span>数据看板</span></div>

      <div style="border-top:1px solid #dfe4ea;padding:12px 18px;display:flex;align-items:center;gap:10px;margin-top:10px">
        <div style="width:26px;height:26px;background:#10161d;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 26px">AD</div>
        <div style="min-width:0"><div style="font-size:13px;font-weight:600">admin</div><div style="font-size:11px;color:#98a2ac">管理员</div></div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:760},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;new&quot;,&quot;records&quot;,&quot;resume&quot;,&quot;learn&quot;,&quot;practice&quot;,&quot;database&quot;,&quot;problemsets&quot;,&quot;dashboard&quot;,&quot;thread&quot;,&quot;session&quot;],&quot;default&quot;:&quot;new&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'new';
    const keys = ['new', 'records', 'resume', 'learn', 'practice', 'database', 'problemsets', 'dashboard'];
    const cls = {};
    keys.forEach(k => { cls[k] = a === k ? 'r2-a on' : 'r2-a'; });
    cls.t1 = a === 'thread' ? 'r2-s on' : 'r2-s';
    return { cls, isSession: a === 'session', isNav: a !== 'session' };
  }
}
</script>
</body>
</html>
