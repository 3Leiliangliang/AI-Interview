t are render props?](#what-are-render-props) | | 50 | [How to dispatch an action on load?](#how-to-dispatch-an-action-on-load) | | 51 | [How to use connect from React Redux?](#how-to-use-connect-from-react-redux) | | 52 | [Whats the purpose of at symbol in the redux connect decorator?](#whats-the-purpose-of-at-symbol-in-the-redux-connect-decorator) | | 53 | [How to use TypeScript in create-react-app application?](#how-to-use-typescript-in-create-react-app-application) | | 54 | [Does the statics object work with ES6 classes in React?](#does-the-statics-object-work-with-es6-classes-in-react) | | 55 | [Why are inline ref callbacks or functions not recommended?](#why-are-inline-ref-callbacks-or-functions-not-recommended) | | 56 | [What are HOC factory implementations?](#what-are-hoc-factory-implementations) | | 57 | [How to use class field declarations syntax in React classes?](#how-to-use-class-field-declarations-syntax-in-react-classes) | | 58 | [Why do you not need error boundaries for event handlers?](#why-do-you-not-need-error-boundaries-for-event-handlers) | | 59 | [What is the difference between try catch block and error boundaries?](#what-is-the-difference-between-try-catch-block-and-error-boundaries) | | 60 | [What is the required method to be defined for a class component?](#what-is-the-required-method-to-be-defined-for-a-class-component) | | 61 | [What are the possible return types of render method?](#what-are-the-possible-return-types-of-render-method) | | 62 | [What is the main purpose of constructor?](#what-is-the-main-purpose-of-constructor) | | 63 | [Is it mandatory to define constructor for React component?](#is-it-mandatory-to-define-constructor-for-react-component) | | 64 | [Why should not call setState in componentWillUnmount?](#why-should-not-call-setstate-in-componentwillunmount) | | 65 | [What is the purpose of getDerivedStateFromError?](#what-is-the-purpose-of-getderivedstatefromerror) | | 66 | [What is the methods order when component re-rendered?](#what-is-the-methods-order-when-component-re-rendered) | | 67 | [What are the methods invoked during error handling?](#what-are-the-methods-invoked-during-error-handling) | | 68 | [What is the purpose of unmountComponentAtNode method?](#what-is-the-purpose-of-unmountcomponentatnode-method) | | 69 | [What are the limitations with HOCs?](#what-are-the-limitations-with-hocs) | | 70 | [How to debug forwardRefs in DevTools?](#how-to-debug-forwardrefs-in-devtools) | | 71 | [Is it good to use arrow functions in render methods?](#is-it-good-to-use-arrow-functions-in-render-methods) | | 72 | [How do you say that state updates are merged?](#how-do-you-say-that-state-updates-are-merged) | | 73 | [How do you pass arguments to an event handler?](#how-do-you-pass-arguments-to-an-event-handler) | | 74 | [How to prevent component from rendering?](#how-to-prevent-component-from-rendering) | | 75 | [Give an example on How to use context?](#give-an-example-on-how-to-use-context) | | 76 | [How do you use contextType?](#how-do-you-use-contexttype) | | 77 | [What is a consumer?](#what-is-a-consumer) | | 78 | [How do you solve performance corner cases while using context?](#how-do-you-solve-performance-corner-cases-while-using-context) | | 79 | [What is the purpose of forward ref in HOCs?](#what-is-the-purpose-of-forward-ref-in-hocs) | | 80 | [Is it ref argument available for all functions or class components?](#is-it-ref-argument-available-for-all-functions-or-class-components) | | 81 | [Why do you need additional care for component libraries while using forward refs?](#why-do-you-need-additional-care-for-component-libraries-while-using-forward-refs) | | 82 | [How to create react class components without ES6?](#how-to-create-react-class-components-without-es6) | | 83 | [Is it possible to use react without JSX?](#is-it-possible-to-use-react-without-jsx) | | 84 | [How do you create HOC using render props?](#how-do-you-create-hoc-using-render-props) | | 85 | [What is react scripts?](#what-is-react-scripts) | | 86 | [What are the features of create react app?](#what-are-the-features-of-create-react-app) | | 87 | [What is the purpose of renderToNodeStream method?](#what-is-the-purpose-of-rendertonodestream-method) | | 88 | [How do you get redux scaffolding using create-react-app?](#how-do-you-get-redux-scaffolding-using-create-react-app) | | 89 | [What is state mutation and how to prevent it?](#what-is-state-mutation-and-how-to-prevent-it) | </details>
